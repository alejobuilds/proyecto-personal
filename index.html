<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#0b1020" />
        <title>Proyecto personal</title>
        <style>
            :root {
                --primario: #4f46e5;
                --texto: #eef1f8;
                --suave: #9aa3b8;
                --borde: rgba(255, 255, 255, 0.12);
            }
            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { height: 100%; margin: 0; }
            body {
                font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: var(--texto);
                background:
                    radial-gradient(60rem 40rem at 10% -10%, rgba(99, 102, 241, 0.35), transparent 60%),
                    radial-gradient(50rem 40rem at 110% 110%, rgba(14, 165, 233, 0.28), transparent 60%),
                    #0b1020;
                display: grid;
                place-items: center;
                padding: 16px;
            }
            .tarjeta {
                width: 100%;
                max-width: 380px;
                padding: 32px 28px 28px;
                border: 1px solid var(--borde);
                border-radius: 22px;
                background: rgba(18, 24, 43, 0.72);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
                animation: aparecer 0.35s ease-out;
            }
            @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } }
            .tarjeta { position: relative; margin-top: 72px; }
            /* Perrito original que se asoma por encima de la tarjeta */
            .perrito {
                position: absolute; left: 50%; top: -86px; width: 150px;
                transform: translateX(-50%);
                filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.35));
            }
            .perrito .cabeza { transform-origin: 75px 95px; animation: ladear 4s ease-in-out infinite; }
            @keyframes ladear { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-6deg); } 90% { transform: rotate(4deg); } }
            .perrito .parpado { transform-box: fill-box; transform-origin: center; animation: parpadear 5s infinite; }
            @keyframes parpadear { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
            .perrito .tapar { opacity: 0; transform: translateY(26px); transition: opacity 0.2s, transform 0.25s; }
            .perrito.tapando .tapar { opacity: 1; transform: translateY(0); }
            .perrito.feliz .lengua { animation: jadear 0.4s ease-in-out 4; }
            @keyframes jadear { 50% { transform: translateY(2px); } }
            h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
            .sub { margin: 6px 0 24px; text-align: center; color: var(--suave); font-size: 14px; }
            .campo { position: relative; }
            #staticrypt-password {
                width: 100%;
                padding: 14px 84px 14px 16px;
                font: inherit; font-size: 16px;
                color: var(--texto);
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--borde);
                border-radius: 14px;
                outline: none;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            #staticrypt-password::placeholder { color: #6f7890; }
            #staticrypt-password:focus { border-color: var(--primario); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25); }
            .mostrar {
                position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                padding: 6px 10px; border: 0; border-radius: 10px;
                background: transparent; color: var(--suave); font: inherit; font-size: 13px; cursor: pointer;
            }
            .mostrar:hover { color: var(--texto); background: rgba(255, 255, 255, 0.06); }
            .error { min-height: 20px; margin: 8px 2px 0; color: #fca5a5; font-size: 13px; }
            .recordar {
                display: flex; align-items: center; gap: 10px;
                margin: 6px 0 20px; color: var(--suave); font-size: 14px; cursor: pointer; user-select: none;
            }
            .recordar input { width: 18px; height: 18px; accent-color: var(--primario); margin: 0; }
            .boton {
                width: 100%; padding: 14px;
                border: 0; border-radius: 14px;
                font: inherit; font-weight: 600; color: #fff; cursor: pointer;
                background: linear-gradient(135deg, var(--primario), #0ea5e9);
                transition: transform 0.08s, filter 0.15s;
            }
            .boton:hover { filter: brightness(1.08); }
            .boton:active { transform: scale(0.99); }
            .boton:disabled { opacity: 0.7; cursor: wait; }
            .agitar { animation: agitar 0.35s; }
            @keyframes agitar {
                20%, 60% { transform: translateX(-6px); }
                40%, 80% { transform: translateX(6px); }
            }
            .cargando { display: grid; place-items: center; }
            .cargando div {
                width: 36px; height: 36px; border-radius: 50%;
                border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--primario);
                animation: girar 0.8s linear infinite;
            }
            @keyframes girar { to { transform: rotate(360deg); } }
        </style>
    </head>

                        <circle cx="91.5" cy="50" r="1.6" fill="#fff" />

                    <ellipse cx="98" cy="66" rx="5" ry="3" fill="#ffb4b4" stroke="none" opacity="0.7" />

                    <path d="M75 71 V75 M67 74 Q71 79 75 75 Q79 79 83 74" fill="none" stroke-linecap="round" />
                    <path class="lengua" d="M72 77 Q75 86 78 77 Z" fill="#ff8a8a" stroke-width="2" />
                </g>
                <!-- patas sobre el borde de la tarjeta -->
                <g stroke="#1f2433" stroke-width="2.5" fill="#fff8ee">
                    <ellipse cx="52" cy="101" rx="13" ry="8" />
                    <ellipse cx="98" cy="101" rx="13" ry="8" />
                </g>

                    <ellipse cx="60" cy="54" rx="13" ry="10" />
                    <ellipse cx="90" cy="54" rx="13" ry="10" />
                </g>
            </svg>
            <h1>Proyecto personal</h1>
            <p class="sub">Espacio privado. Escribe la contraseña para continuar.</p>

            <form id="staticrypt-form" action="#" method="post">
                <div class="campo">
                    <input id="staticrypt-password" type="password" name="password" autocomplete="current-password"

                    <button type="button" class="mostrar" id="mostrar">Mostrar</button>
                </div>
                <p class="error" id="error" role="alert"></p>

                <label id="staticrypt-remember-label" class="recordar hidden">
                    <input id="staticrypt-remember" type="checkbox" name="remember" />
                    Recordarme 30 días en este dispositivo
                </label>

                <button type="submit" class="boton" id="entrar">Entrar</button>
            </form>
        </main>
