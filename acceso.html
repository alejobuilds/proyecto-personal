<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#0b1020" />
        <title>/*[|template_title|]*/0</title>
        <style>
            :root {
                --primario: /*[|template_color_primary|]*/ 0;
                --texto: #eef1f8;
                --suave: #9aa3b8;
                --borde: rgba(255, 255, 255, 0.12);
            }
            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { height: 100%; margin: 0; }
            body {
                font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: var(--texto);
                background:
                    radial-gradient(60rem 40rem at 10% -10%, rgba(99, 102, 241, 0.35), transparent 60%),
                    radial-gradient(50rem 40rem at 110% 110%, rgba(14, 165, 233, 0.28), transparent 60%),
                    #0b1020;
                display: grid;
                place-items: center;
                padding: 16px;
            }
            .tarjeta {
                width: 100%;
                max-width: 380px;
                padding: 32px 28px 28px;
                border: 1px solid var(--borde);
                border-radius: 22px;
                background: rgba(18, 24, 43, 0.72);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
                animation: aparecer 0.35s ease-out;
            }
            @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } }
            .tarjeta { position: relative; margin-top: 72px; }
            /* Perrito original que se asoma por encima de la tarjeta */
            .perrito {
                position: absolute; left: 50%; top: -86px; width: 150px;
                transform: translateX(-50%);
                filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.35));
            }
            .perrito .cabeza { transform-origin: 75px 95px; animation: ladear 4s ease-in-out infinite; }
            @keyframes ladear { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-6deg); } 90% { transform: rotate(4deg); } }
            .perrito .parpado { transform-box: fill-box; transform-origin: center; animation: parpadear 5s infinite; }
            @keyframes parpadear { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
            .perrito .tapar { opacity: 0; transform: translateY(26px); transition: opacity 0.2s, transform 0.25s; }
            .perrito.tapando .tapar { opacity: 1; transform: translateY(0); }
            .perrito.feliz .lengua { animation: jadear 0.4s ease-in-out 4; }
            @keyframes jadear { 50% { transform: translateY(2px); } }
            h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
            .sub { margin: 6px 0 24px; text-align: center; color: var(--suave); font-size: 14px; }
            .campo { position: relative; }
            #staticrypt-password {
                width: 100%;
                padding: 14px 84px 14px 16px;
                font: inherit; font-size: 16px;
                color: var(--texto);
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--borde);
                border-radius: 14px;
                outline: none;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            #staticrypt-password::placeholder { color: #6f7890; }
            #staticrypt-password:focus { border-color: var(--primario); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25); }
            .mostrar {
                position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                padding: 6px 10px; border: 0; border-radius: 10px;
                background: transparent; color: var(--suave); font: inherit; font-size: 13px; cursor: pointer;
            }
            .mostrar:hover { color: var(--texto); background: rgba(255, 255, 255, 0.06); }
            .error { min-height: 20px; margin: 8px 2px 0; color: #fca5a5; font-size: 13px; }
            .recordar {
                display: flex; align-items: center; gap: 10px;
                margin: 6px 0 20px; color: var(--suave); font-size: 14px; cursor: pointer; user-select: none;
            }
            .recordar input { width: 18px; height: 18px; accent-color: var(--primario); margin: 0; }
            .boton {
                width: 100%; padding: 14px;
                border: 0; border-radius: 14px;
                font: inherit; font-weight: 600; color: #fff; cursor: pointer;
                background: linear-gradient(135deg, var(--primario), #0ea5e9);
                transition: transform 0.08s, filter 0.15s;
            }
            .boton:hover { filter: brightness(1.08); }
            .boton:active { transform: scale(0.99); }
            .boton:disabled { opacity: 0.7; cursor: wait; }
            .agitar { animation: agitar 0.35s; }
            @keyframes agitar {
                20%, 60% { transform: translateX(-6px); }
                40%, 80% { transform: translateX(6px); }
            }
            .cargando { display: grid; place-items: center; }
            .cargando div {
                width: 36px; height: 36px; border-radius: 50%;
                border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--primario);
                animation: girar 0.8s linear infinite;
            }
            @keyframes girar { to { transform: rotate(360deg); } }
        </style>
    </head>

    <body>
        <div id="staticrypt_loading" class="cargando"><div></div></div>

        <main id="staticrypt_content" class="tarjeta hidden">
            <svg class="perrito" id="perrito" viewBox="0 0 150 110" aria-hidden="true">
                <g class="cabeza" stroke="#1f2433" stroke-width="2.5" stroke-linejoin="round">
                    <!-- orejas -->
                    <path d="M38 34 C20 30 12 52 18 74 C22 86 34 84 38 72 Z" fill="#c98a4b" />
                    <path d="M112 34 C130 30 138 52 132 74 C128 86 116 84 112 72 Z" fill="#c98a4b" />
                    <!-- cara -->
                    <ellipse cx="75" cy="58" rx="40" ry="37" fill="#fff8ee" />
                    <ellipse cx="94" cy="50" rx="13" ry="11" fill="#f1c99a" stroke="none" />
                    <!-- ojos -->
                    <g class="ojos" stroke="none">
                        <ellipse class="parpado" cx="60" cy="52" rx="4.5" ry="5.5" fill="#1f2433" />
                        <ellipse class="parpado" cx="90" cy="52" rx="4.5" ry="5.5" fill="#1f2433" />
                        <circle cx="61.5" cy="50" r="1.6" fill="#fff" />
                        <circle cx="91.5" cy="50" r="1.6" fill="#fff" />
                    </g>
                    <ellipse cx="52" cy="66" rx="5" ry="3" fill="#ffb4b4" stroke="none" opacity="0.7" />
                    <ellipse cx="98" cy="66" rx="5" ry="3" fill="#ffb4b4" stroke="none" opacity="0.7" />
                    <!-- hocico -->
                    <ellipse cx="75" cy="66" rx="7" ry="5" fill="#1f2433" />
                    <path d="M75 71 V75 M67 74 Q71 79 75 75 Q79 79 83 74" fill="none" stroke-linecap="round" />
                    <path class="lengua" d="M72 77 Q75 86 78 77 Z" fill="#ff8a8a" stroke-width="2" />
                </g>
                <!-- patas sobre el borde de la tarjeta -->
                <g stroke="#1f2433" stroke-width="2.5" fill="#fff8ee">
                    <ellipse cx="52" cy="101" rx="13" ry="8" />
                    <ellipse cx="98" cy="101" rx="13" ry="8" />
                </g>
                <!-- patas que tapan los ojos mientras escribes la contraseña -->
                <g class="tapar" stroke="#1f2433" stroke-width="2.5" fill="#fff8ee">
                    <ellipse cx="60" cy="54" rx="13" ry="10" />
                    <ellipse cx="90" cy="54" rx="13" ry="10" />
                </g>
            </svg>
            <h1>/*[|template_title|]*/0</h1>
            <p class="sub">/*[|template_instructions|]*/0</p>

            <form id="staticrypt-form" action="#" method="post">
                <div class="campo">
                    <input id="staticrypt-password" type="password" name="password" autocomplete="current-password"
                        placeholder="/*[|template_placeholder|]*/0" autofocus />
                    <button type="button" class="mostrar" id="mostrar">/*[|template_toggle_show|]*/0</button>
                </div>
                <p class="error" id="error" role="alert"></p>

                <label id="staticrypt-remember-label" class="recordar hidden">
                    <input id="staticrypt-remember" type="checkbox" name="remember" />
                    /*[|template_remember|]*/0
                </label>

                <button type="submit" class="boton" id="entrar">/*[|template_button|]*/0</button>
            </form>
        </main>

        <script>
            // Variables que StatiCrypt rellena al generar el archivo (formato '/*[|nombre|]*/0').
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }
                }
            };

            const campo = document.getElementById("staticrypt-password");
            const mostrar = document.getElementById("mostrar");
            const perrito = document.getElementById("perrito");
            // El perrito se tapa los ojos mientras escribes la contraseña (si está oculta).
            const actualizarPerrito = () =>
                perrito.classList.toggle("tapando", document.activeElement === campo && campo.type === "password" && campo.value.length > 0);
            campo.addEventListener("focus", actualizarPerrito);
            campo.addEventListener("blur", actualizarPerrito);
            mostrar.addEventListener("click", function () {
                const oculto = campo.type === "password";
                campo.type = oculto ? "text" : "password";
                mostrar.textContent = oculto ? templateToggleAltHide : templateToggleAltShow;
                campo.focus();
                actualizarPerrito();
            });
            campo.addEventListener("input", function () {
                document.getElementById("error").textContent = "";
                actualizarPerrito();
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const boton = document.getElementById("entrar");
                boton.disabled = true;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(
                    campo.value,
                    document.getElementById("staticrypt-remember").checked
                );
                if (isSuccessful) {
                    perrito.classList.add("feliz");
                } else {
                    boton.disabled = false;
                    document.getElementById("error").textContent = templateError;
                    const tarjeta = document.getElementById("staticrypt_content");
                    tarjeta.classList.remove("agitar");
                    void tarjeta.offsetWidth;
                    tarjeta.classList.add("agitar");
                    campo.select();
                }
            });
        </script>
    </body>
</html>
